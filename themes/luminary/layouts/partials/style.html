<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
{{ range site.Params.plugins.css }}
{{ if findRE "^http" .link }}
<link rel="stylesheet" href="{{ .link }}" {{ .attributes | safeHTMLAttr }}>
{{ else }}
{{ $css := resources.Get .link }}
{{ if $css }}<link rel="stylesheet" href="{{ ($css | minify | fingerprint).RelPermalink }}">{{ end }}
{{ end }}
{{ end }}
{{ $css := resources.Get "css/luminary.css" | minify | fingerprint "sha512" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">
