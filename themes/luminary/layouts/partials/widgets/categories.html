<div class="sidebar-card widget-categories">
  <h3 class="widget-title">Categories</h3>
  <ul class="widget-categories-list">
    {{ range $.Site.Taxonomies.categories.ByCount }}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        {{ .Page.Title }}
        <span class="count">({{ .Count }})</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
