{{ define "main" }}
<div class="contact-page-wrapper">

  <!-- Contact hero -->
  <div class="contact-hero">
    <div class="contact-hero-inner">
      <div class="contact-author">
        {{ with .Params.image }}
        <img src="{{ . | absURL }}" alt="{{ site.Params.author }}" class="contact-author-photo">
        {{ end }}
        <h1 class="contact-author-name">{{ site.Params.author }}</h1>
        <p class="contact-author-tagline">{{ site.Params.description }}</p>

        <!-- Social links -->
        <div class="contact-social">
          {{ range site.Params.social }}
          <a href="{{ .link | safeURL }}" class="contact-social-link" title="{{ .title }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .title }}">
            <i class="{{ .icon }}" aria-hidden="true"></i>
            <span>{{ .title }}</span>
          </a>
          {{ end }}
        </div>
      </div>

      <!-- Contact content / message -->
      <div class="contact-content">
        <div class="contact-content-header">
          <span class="contact-eyebrow">Get in touch</span>
          <h2 class="contact-content-title">{{ .Title }}</h2>
        </div>
        <div class="post-body contact-body">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Footer is skipped by baseof.html for contact layout, so include it here -->
{{ partialCached "footer.html" . }}
{{ end }}
