<!DOCTYPE html>
<html lang="{{ with site.LanguageCode }}{{ . }}{{ else }}en-US{{ end }}" data-theme="dark">

<head>
  <script>(function(){var t=localStorage.getItem('luminary-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  {{ partial "head.html" . }}
  {{ partialCached "style.html" . }}
</head>

<body>
  {{- partial "header.html" . -}}
  {{ partial "gtm-noscript.html" . }}
  {{- block "main" . }}
  {{- end }}

  {{ if ne .Layout "contact" }}
  {{ partialCached "footer.html" . }}
  {{ end }}
  {{ partialCached "script.html" . }}
</body>

</html>
